[entity-description]
bulk-wagon=Carries ores and other bulk goods only. Has three compartments, each can be served by its own loading station or unloading pit.
bulk-unloading-pit=Built across the track. Empties stopped bulk wagons above it. Take items out with the built-in belt or with inserters.
bulk-loading-station=Built across the track. Fills stopped bulk wagons below it. Feed it with the built-in belt or with inserters.

