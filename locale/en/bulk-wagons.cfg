bulk-wagons-transfer-rate=Transfer rate per station (items/s)
bulk-wagons-extra-items=Additional bulk items

[mod-setting-description]
bulk-wagons-pit-multiplier=Inventory of the unloading pit as a multiple of the wagon inventory.
bulk-wagons-loader-multiplier=Inventory of the loading station as a multiple of the wagon inventory.
bulk-wagons-port-belt=Which belt tier the built-in belt port of both stations matches.
bulk-wagons-transfer-rate=How many items per second each station moves between its inventory and the wagon.
bulk-wagons-extra-items=Comma separated internal item names that may also be loaded into bulk wagons, e.g. stone-brick,landfill. All mined resources are allowed automatically.

