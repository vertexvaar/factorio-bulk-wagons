[mod-setting-description]
bulk-wagons-wagon-weight=Gewicht des Schüttgutwaggons. 1000 entspricht dem normalen Güterwaggon, 2000 der Lok. Schwerere Waggons lassen Züge langsamer beschleunigen und bremsen.
bulk-wagons-pit-multiplier=Inventar des Entladebunkers als Vielfaches des Waggoninventars.
bulk-wagons-loader-multiplier=Inventar des Verladesilos als Vielfaches des Waggoninventars.
bulk-wagons-port-belt=Welcher Bandstufe das eingebaute Band beider Stationen entspricht.
bulk-wagons-transfer-rate=Wie viele Items pro Sekunde jede Station zwischen ihrem Inventar und dem Waggon bewegt.
bulk-wagons-extra-items=Kommagetrennte interne Itemnamen, die zusätzlich in Schüttgutwaggons dürfen, z. B. stone-brick,landfill. Alle abbaubaren Rohstoffe sind automatisch erlaubt.

