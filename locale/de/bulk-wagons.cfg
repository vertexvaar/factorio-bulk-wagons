[entity-description]
bulk-belt-loader=Wird quer über das Gleis gebaut. Belädt haltende Schüttgutwaggons direkt vom angeschlossenen Band, so schnell wie dieses läuft. Hat kein Inventar.
bulk-wagon=Transportiert nur Erze und andere Schüttgüter. Wird von einem Entladebunker oder Verladesilo über seine ganze Länge bedient.
bulk-unloading-pit=Wird quer über das Gleis gebaut. Leert haltende Schüttgutwaggons darüber. Entnahme über das eingebaute Band oder Greifarme.
bulk-loading-station=Wird quer über das Gleis gebaut. Füllt haltende Schüttgutwaggons darunter. Befüllung über das eingebaute Band oder Greifarme.
bulk-unloading-bunker=Wird über einen ganzen Waggonplatz gebaut, das Gleis läuft hindurch. Leert den haltenden Schüttgutwaggon durch seine Bodenklappen. Abgabe über Schüttgut-Anschlüsse an den Längsseiten oder Greifarme. Die Gitter sind begehbar und befahrbar.
bulk-loading-silo=Steht über einem ganzen Waggonplatz, das Gleis läuft darunter durch. Sammelt Schüttgut und füllt den haltenden Waggon über drei Schurren. Befüllung über Schüttgut-Anschlüsse an den Längsseiten oder Greifarme.
bulk-connector=Wird auf den Rand einer Längsseite eines Entladebunkers oder Verladesilos gebaut, höchstens drei pro Seite, und verbindet es mit einem Band. Die Pfeilrichtung legt fest, ob er Ware abgibt oder einfüllt. Läuft so schnell wie seine Bandstufe. Ohne Band hält er die Ware zurück, nichts fällt auf den Boden.

